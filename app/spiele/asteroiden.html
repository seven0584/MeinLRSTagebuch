<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asteroiden-Sturm</title>
<style>
  body{margin:0;background:#05070d;color:#e6e9ef;font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px;user-select:none}
  h1{margin:4px 0 6px;font-size:1.5rem;letter-spacing:.05em}
  .bar{display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap;justify-content:center}
  .box{background:#141b2b;border-radius:8px;padding:5px 12px;font-weight:700}
  canvas{background:#000;border-radius:10px;box-shadow:0 0 24px #4dabf733;max-width:100%;max-height:calc(100vh - 150px)}
  .hint{opacity:.7;font-size:.9rem;margin:8px 0 0;text-align:center}
</style>
</head>
<body>
<h1>☄️ Asteroiden-Sturm</h1>
<div class="bar"><div class="box">Punkte <span id="score">0</span></div><div class="box">Leben <span id="lives">3</span></div><div class="box">Welle <span id="wave">1</span></div><div class="box">🏆 <span id="best">0</span></div></div>
<canvas id="c" width="760" height="540" tabindex="0"></canvas>
<p class="hint">← → drehen · ↑ Schub · Leertaste schießen · P Pause · Enter: neues Spiel</p>
<script>
(() => {
  const cv = document.getElementById("c"), g = cv.getContext("2d"), W = cv.width, H = cv.height;
  const keys = {}; let ship, rocks, shots, parts, score, lives, wave, over = true, paused = false, inv = 0, last = 0, cool = 0;
  let best = 0; try{ best = +localStorage.getItem("ast-best") || 0; }catch(e){}
  const $ = s => document.querySelector(s);
  function rock(x, y, r){ const n = 10, pts = Array.from({ length: n }, (_, i) => r * (0.75 + Math.random() * 0.35)); const a = Math.random() * 6.28, s = (1.2 + Math.random() * 1.2) * (40 / r) * 0.6 + wave * 0.15; return { x, y, r, pts, vx: Math.cos(a) * s, vy: Math.sin(a) * s, rot: (Math.random() - .5) * .04, ang: 0 }; }
  function newWave(){ rocks = []; for(let i = 0; i < 3 + wave; i++){ let x, y; do { x = Math.random() * W; y = Math.random() * H; } while(Math.hypot(x - ship.x, y - ship.y) < 160); rocks.push(rock(x, y, 46)); } $("#wave").textContent = wave; }
  function reset(){ ship = { x: W / 2, y: H / 2, a: -Math.PI / 2, vx: 0, vy: 0 }; score = 0; lives = 3; wave = 1; shots = []; parts = []; over = false; inv = 120; newWave(); hud(); }
  function hud(){ $("#score").textContent = score; $("#lives").textContent = lives; $("#best").textContent = best; }
  const wrap = o => { o.x = (o.x + W) % W; o.y = (o.y + H) % H; };
  function boom(x, y, n){ for(let i = 0; i < n; i++){ const a = Math.random() * 6.28, s = Math.random() * 3; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 30 + Math.random() * 20 }); } }
  function step(){
    if(keys.ArrowLeft) ship.a -= 0.075; if(keys.ArrowRight) ship.a += 0.075;
    if(keys.ArrowUp){ ship.vx += Math.cos(ship.a) * 0.12; ship.vy += Math.sin(ship.a) * 0.12; }
    ship.vx *= 0.99; ship.vy *= 0.99; ship.x += ship.vx; ship.y += ship.vy; wrap(ship);
    if(cool > 0) cool--;
    if(keys[" "] && cool === 0 && shots.length < 6){ shots.push({ x: ship.x + Math.cos(ship.a) * 14, y: ship.y + Math.sin(ship.a) * 14, vx: Math.cos(ship.a) * 7 + ship.vx, vy: Math.sin(ship.a) * 7 + ship.vy, l: 60 }); cool = 9; }
    shots.forEach(s => { s.x += s.vx; s.y += s.vy; s.l--; wrap(s); }); shots = shots.filter(s => s.l > 0);
    rocks.forEach(r => { r.x += r.vx; r.y += r.vy; r.ang += r.rot; wrap(r); });
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.l--; }); parts = parts.filter(p => p.l > 0);
    for(const s of shots) for(const r of rocks){ if(!r.dead && Math.hypot(s.x - r.x, s.y - r.y) < r.r){ r.dead = true; s.l = 0; score += r.r > 40 ? 20 : r.r > 20 ? 50 : 100; boom(r.x, r.y, 12); if(r.r > 15) for(let k = 0; k < 2; k++) rocks.push(rock(r.x, r.y, r.r / 2)); break; } }
    rocks = rocks.filter(r => !r.dead);
    if(inv > 0) inv--;
    else for(const r of rocks) if(Math.hypot(ship.x - r.x, ship.y - r.y) < r.r + 10){ boom(ship.x, ship.y, 30); lives--; inv = 150; ship.x = W / 2; ship.y = H / 2; ship.vx = ship.vy = 0; if(lives <= 0){ over = true; if(score > best){ best = score; try{ localStorage.setItem("ast-best", best); }catch(e){} } } break; }
    if(!rocks.length){ wave++; newWave(); }
    hud();
  }
  function draw(){
    g.fillStyle = "#000"; g.fillRect(0, 0, W, H); g.strokeStyle = "#dbe4ff"; g.lineWidth = 2;
    rocks.forEach(r => { g.beginPath(); r.pts.forEach((d, i) => { const a = r.ang + i / r.pts.length * 6.283; const x = r.x + Math.cos(a) * d, y = r.y + Math.sin(a) * d; i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); g.stroke(); });
    g.fillStyle = "#ffd43b"; shots.forEach(s => { g.fillRect(s.x - 2, s.y - 2, 4, 4); });
    g.fillStyle = "#ff922b"; parts.forEach(p => { g.globalAlpha = p.l / 50; g.fillRect(p.x, p.y, 2, 2); }); g.globalAlpha = 1;
    if(!over && (inv === 0 || Math.floor(inv / 6) % 2)){
      g.save(); g.translate(ship.x, ship.y); g.rotate(ship.a); g.strokeStyle = "#69db7c"; g.beginPath(); g.moveTo(14, 0); g.lineTo(-10, -9); g.lineTo(-6, 0); g.lineTo(-10, 9); g.closePath(); g.stroke();
      if(keys.ArrowUp){ g.strokeStyle = "#ff922b"; g.beginPath(); g.moveTo(-7, -4); g.lineTo(-15 - Math.random() * 6, 0); g.lineTo(-7, 4); g.stroke(); }
      g.restore();
    }
    g.fillStyle = "#e6e9ef"; g.textAlign = "center"; g.font = "bold 26px system-ui";
    if(over) { g.fillText(score ? "Spiel vorbei – " + score + " Punkte" : "Asteroiden-Sturm", W / 2, H / 2 - 10); g.font = "18px system-ui"; g.fillText("Enter oder Klick zum Starten", W / 2, H / 2 + 24); }
    else if(paused) g.fillText("Pause", W / 2, H / 2);
  }
  function loop(t){ if(!over && !paused && t - last > 1000 / 61){ step(); last = t; } draw(); requestAnimationFrame(loop); }
  addEventListener("keydown", e => { if(["ArrowLeft","ArrowRight","ArrowUp"," ","ArrowDown"].includes(e.key)) e.preventDefault(); keys[e.key] = true; if(e.key === "Enter" && over) reset(); if((e.key === "p" || e.key === "P") && !over) paused = !paused; });
  addEventListener("keyup", e => { keys[e.key] = false; });
  cv.addEventListener("click", () => { cv.focus(); if(over) reset(); });
  ship = { x: W / 2, y: H / 2, a: -Math.PI / 2, vx: 0, vy: 0 }; rocks = []; shots = []; parts = []; wave = 1; score = 0; lives = 3; newWave(); hud(); requestAnimationFrame(loop); cv.focus();
})();
</script>
</body>
</html>
