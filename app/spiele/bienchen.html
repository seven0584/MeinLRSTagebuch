<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bienchen-Labyrinth</title>
<style>
  body{margin:0;background:#0b1020;color:#e6e9ef;font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px;user-select:none}
  h1{margin:4px 0 6px;font-size:1.5rem}
  .bar{display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap;justify-content:center}
  .box{background:#151d33;border-radius:8px;padding:5px 12px;font-weight:700}
  canvas{border-radius:10px;box-shadow:0 0 24px #fcc41933;max-width:100%;max-height:calc(100vh - 160px)}
  .hint{opacity:.7;font-size:.9rem;margin:8px 0 0;text-align:center}
  .pad{display:flex;gap:6px;margin-top:6px}.pad button{width:46px;height:46px;border-radius:10px;border:1px solid #334;background:#151d33;color:#fff;font-size:1.2rem}
</style>
</head>
<body>
<h1>🐝 Bienchen-Labyrinth</h1>
<div class="bar"><div class="box">Punkte <span id="score">0</span></div><div class="box">Leben <span id="lives">3</span></div><div class="box">Level <span id="level">1</span></div><div class="box">🏆 <span id="best">0</span></div></div>
<canvas id="c" tabindex="0"></canvas>
<p class="hint">Pfeiltasten: fliegen · Sammle allen Blütenstaub · Eine 🌸 Blume macht die Spinnen ängstlich · P Pause · Enter: Start</p>
<div class="pad"><button data-d="L">◀</button><button data-d="U">▲</button><button data-d="D">▼</button><button data-d="R">▶</button></div>
<script>
(() => {
  // Own maze (21 x 21). # wall, . pollen, o flower, - spider door, S spider home, ' ' free path, X void
  const MAP = [
    "#####################",
    "#.........#.........#",
    "#o###.###.#.###.###o#",
    "#...................#",
    "#.###.#.#####.#.###.#",
    "#.....#...#...#.....#",
    "#####.###.#.###.#####",
    "XXXX#.#.......#.#XXXX",
    "#####.#.##-##.#.#####",
    "     ...#SSS#...     ",
    "#####.#.#####.#.#####",
    "XXXX#.#.......#.#XXXX",
    "#####.#.#####.#.#####",
    "#.........#.........#",
    "#.###.###.#.###.###.#",
    "#o..#...........#..o#",
    "###.#.#.#####.#.#.###",
    "#.....#...#...#.....#",
    "#.#######.#.#######.#",
    "#...................#",
    "#####################"];
  const COLS = 21, ROWS = 21, T = 26, cv = document.getElementById("c"), g = cv.getContext("2d");
  cv.width = COLS * T; cv.height = ROWS * T;
  const DIRS = { L:[-1,0], R:[1,0], U:[0,-1], D:[0,1] }, OPP = { L:"R", R:"L", U:"D", D:"U" };
  let grid, dots, bee, spiders, score = 0, lives = 3, level = 1, fright = 0, chain = 0, over = true, paused = false, mode = "scatter", modeT = 0, deadT = 0, best = 0, msg = "Enter oder Klick zum Starten";
  try{ best = +localStorage.getItem("bee-best") || 0; }catch(e){}
  const $ = s => document.querySelector(s);
  const wall = (x, y, ghost) => { if(y === 9 && (x < 0 || x >= COLS)) return false; if(x < 0 || x >= COLS || y < 0 || y >= ROWS) return true; const c = grid[y][x]; return c === "#" || c === "X" || (c === "-" && !ghost); };
  function load(){
    grid = MAP.map(r => r.split("")); dots = 0;
    grid.forEach(r => r.forEach(c => { if(c === "." || c === "o") dots++; }));
  }
  function place(){
    bee = { x: 10, y: 15, dir: "L", want: "L", p: 0, sp: 0.12 + level * 0.005 };
    const cols = ["#fa5252", "#be4bdb", "#15aabf", "#fd7e14"];
    spiders = cols.map((c, i) => ({ x: 9 + (i % 3), y: 9, dir: "U", p: 0, col: c, home: i, wait: i * 90, eaten: false, corner: [[1,1],[19,1],[1,19],[19,19]][i] }));
    fright = 0; mode = "scatter"; modeT = 0;
  }
  function start(){ score = 0; lives = 3; level = 1; load(); place(); over = false; msg = ""; hud(); cv.focus(); }
  function hud(){ $("#score").textContent = score; $("#lives").textContent = lives; $("#level").textContent = level; $("#best").textContent = best; }
  const canGo = (e, d, ghost) => { const [dx, dy] = DIRS[d]; return !wall(e.x + dx, e.y + dy, ghost); };
  function advance(e, speed, chooseDir, ghost){
    if(e.p === 0){ const d = chooseDir(e); if(d === "STAY") return; if(d) e.dir = d; if(!canGo(e, e.dir, ghost)) return; }
    e.p += speed;
    if(e.p >= 1){ const [dx, dy] = DIRS[e.dir]; e.x += dx; e.y += dy; e.p = 0; if(e.x < 0) e.x = COLS - 1; if(e.x >= COLS) e.x = 0; return true; }
  }
  function target(s){
    if(s.eaten) return [10, 9];
    if(mode === "scatter") return s.corner;
    const [dx, dy] = DIRS[bee.dir];
    if(s.home === 0) return [bee.x, bee.y];
    if(s.home === 1) return [bee.x + dx * 4, bee.y + dy * 4];
    if(s.home === 2) return [bee.x - dx * 3, bee.y - dy * 3];
    return Math.hypot(s.x - bee.x, s.y - bee.y) > 7 ? [bee.x, bee.y] : s.corner;
  }
  function spiderDir(s){
    const inHome = grid[s.y] && grid[s.y][s.x] === "S";
    if(inHome && !s.eaten){ if(s.wait > 0) return "STAY"; return s.x === 10 ? "U" : (s.x < 10 ? "R" : "L"); }
    const opts = Object.keys(DIRS).filter(d => d !== OPP[s.dir] && canGo(s, d, true) && !(grid[s.y + DIRS[d][1]] && grid[s.y + DIRS[d][1]][s.x + DIRS[d][0]] === "S" && !s.eaten));
    if(!opts.length) return OPP[s.dir];
    if(fright > 0 && !s.eaten) return opts[Math.floor(Math.random() * opts.length)];
    const [tx, ty] = target(s);
    return opts.sort((a, b) => Math.hypot(s.x + DIRS[a][0] - tx, s.y + DIRS[a][1] - ty) - Math.hypot(s.x + DIRS[b][0] - tx, s.y + DIRS[b][1] - ty))[0];
  }
  function step(){
    if(deadT > 0){ deadT--; if(deadT === 0){ if(lives <= 0){ over = true; msg = "Spiel vorbei – " + score + " Punkte"; if(score > best){ best = score; try{ localStorage.setItem("bee-best", best); }catch(e){} } hud(); } else place(); } return; }
    modeT++; if(fright === 0 && modeT > (mode === "scatter" ? 420 : 1200)){ mode = mode === "scatter" ? "chase" : "scatter"; modeT = 0; spiders.forEach(s => { if(s.p === 0) s.dir = OPP[s.dir]; }); }
    if(fright > 0) fright--;
    if(advance(bee, bee.sp, e => canGo(e, e.want, false) ? e.want : (canGo(e, e.dir, false) ? e.dir : null), false) || bee.p === 0){
      const c = grid[bee.y][bee.x];
      if(c === "." || c === "o"){ grid[bee.y][bee.x] = " "; dots--; score += c === "o" ? 50 : 10; if(c === "o"){ fright = Math.max(240 - level * 15, 90); chain = 0; } if(dots === 0){ level++; load(); place(); } hud(); }
    }
    spiders.forEach(s => {
      if(s.wait > 0) s.wait--;
      const sp = s.eaten ? 0.2 : fright > 0 ? 0.06 : 0.09 + level * 0.004 + (grid[s.y][s.x] === " " && s.y === 9 && (s.x < 5 || s.x > 15) ? -0.04 : 0);
      advance(s, sp, spiderDir, true);
      if(s.eaten && s.x === 10 && s.y === 9 && s.p === 0){ s.eaten = false; s.dir = "U"; }
      const bx = bee.x + (bee.p ? DIRS[bee.dir][0] * bee.p : 0), by = bee.y + (bee.p ? DIRS[bee.dir][1] * bee.p : 0);
      const sx = s.x + (s.p ? DIRS[s.dir][0] * s.p : 0), sy = s.y + (s.p ? DIRS[s.dir][1] * s.p : 0);
      if(!s.eaten && Math.hypot(bx - sx, by - sy) < 0.7){
        if(fright > 0){ s.eaten = true; chain++; score += 100 * Math.pow(2, chain); hud(); }
        else { lives--; deadT = 90; hud(); }
      }
    });
  }
  // ---- drawing: own characters (a bee and spiders) ----
  function drawBee(x, y, dir, t){
    g.save(); g.translate(x, y); g.rotate({ R:0, D:Math.PI/2, L:Math.PI, U:-Math.PI/2 }[dir]);
    const flap = Math.sin(t / 60) * 0.35;
    g.fillStyle = "rgba(220,240,255,.85)";
    g.beginPath(); g.ellipse(-2, -9, 7, 4, -0.6 + flap, 0, 6.3); g.fill(); g.beginPath(); g.ellipse(-2, 9, 7, 4, 0.6 - flap, 0, 6.3); g.fill();
    g.fillStyle = "#fcc419"; g.beginPath(); g.ellipse(0, 0, 11, 8.5, 0, 0, 6.3); g.fill();
    g.fillStyle = "#222"; g.fillRect(-5, -8, 3.5, 16); g.fillRect(1, -8, 3.5, 16);
    g.beginPath(); g.moveTo(-11, 0); g.lineTo(-15, -2); g.lineTo(-15, 2); g.fill();
    g.fillStyle = "#fff"; g.beginPath(); g.arc(7, -3, 2.6, 0, 6.3); g.fill(); g.fillStyle = "#000"; g.beginPath(); g.arc(7.8, -3, 1.3, 0, 6.3); g.fill();
    g.restore();
  }
  function drawSpider(x, y, s, t){
    const scared = fright > 0 && !s.eaten, col = s.eaten ? "rgba(255,255,255,.25)" : scared ? (fright < 60 && Math.floor(t / 150) % 2 ? "#f8f9fa" : "#4dabf7") : s.col;
    g.strokeStyle = s.eaten ? "rgba(255,255,255,.3)" : "#ced4da"; g.lineWidth = 1.6;
    const wig = Math.sin(t / 90 + s.home) * 2;
    for(let i = 0; i < 4; i++){ const yy = -6 + i * 4; g.beginPath(); g.moveTo(x - 5, y + yy); g.lineTo(x - 11, y + yy - 3 + wig); g.lineTo(x - 13, y + yy + 4); g.stroke(); g.beginPath(); g.moveTo(x + 5, y + yy); g.lineTo(x + 11, y + yy - 3 - wig); g.lineTo(x + 13, y + yy + 4); g.stroke(); }
    g.fillStyle = col; g.beginPath(); g.arc(x, y, 8, 0, 6.3); g.fill();
    g.fillStyle = "#fff"; g.beginPath(); g.arc(x - 3, y - 2, 2.5, 0, 6.3); g.arc(x + 3, y - 2, 2.5, 0, 6.3); g.fill();
    g.fillStyle = "#000"; g.beginPath(); g.arc(x - 3, y - 1.5, 1.1, 0, 6.3); g.arc(x + 3, y - 1.5, 1.1, 0, 6.3); g.fill();
  }
  function draw(t){
    g.fillStyle = "#0b1020"; g.fillRect(0, 0, cv.width, cv.height);
    for(let y = 0; y < ROWS; y++) for(let x = 0; x < COLS; x++){
      const c = grid[y][x], px = x * T, py = y * T;
      if(c === "#"){ g.fillStyle = "#2f9e44"; g.beginPath(); g.roundRect(px + 2, py + 2, T - 4, T - 4, 6); g.fill(); g.fillStyle = "#40c057"; g.beginPath(); g.roundRect(px + 5, py + 5, T - 10, T - 10, 4); g.fill(); }
      else if(c === "-"){ g.fillStyle = "#adb5bd"; g.fillRect(px, py + T / 2 - 2, T, 4); }
      else if(c === "."){ g.fillStyle = "#ffe066"; g.beginPath(); g.arc(px + T / 2, py + T / 2, 2.8, 0, 6.3); g.fill(); }
      else if(c === "o"){ const r = 7 + Math.sin(t / 200) * 1.5; g.fillStyle = "#f783ac"; for(let k = 0; k < 5; k++){ const a = k * 1.2566; g.beginPath(); g.arc(px + T / 2 + Math.cos(a) * 5, py + T / 2 + Math.sin(a) * 5, r / 2.2, 0, 6.3); g.fill(); } g.fillStyle = "#ffd43b"; g.beginPath(); g.arc(px + T / 2, py + T / 2, 3.5, 0, 6.3); g.fill(); }
    }
    const pos = e => [(e.x + (e.p ? DIRS[e.dir][0] * e.p : 0)) * T + T / 2, (e.y + (e.p ? DIRS[e.dir][1] * e.p : 0)) * T + T / 2];
    spiders.forEach(s => { const [x, y] = pos(s); drawSpider(x, y, s, t); });
    if(!(deadT > 0 && Math.floor(deadT / 8) % 2)){ const [x, y] = pos(bee); drawBee(x, y, bee.dir, t); }
    if(over || paused){ g.fillStyle = "rgba(0,0,0,.6)"; g.fillRect(0, cv.height / 2 - 40, cv.width, 80); g.fillStyle = "#fff"; g.font = "bold 22px system-ui"; g.textAlign = "center"; g.fillText(paused ? "Pause" : msg, cv.width / 2, cv.height / 2 + 8); }
  }
  let last = 0;
  function loop(t){ if(!over && !paused && t - last > 1000 / 61){ step(); last = t; } draw(t); requestAnimationFrame(loop); }
  const KEYMAP = { ArrowLeft:"L", ArrowRight:"R", ArrowUp:"U", ArrowDown:"D" };
  addEventListener("keydown", e => { if(KEYMAP[e.key]){ e.preventDefault(); bee.want = KEYMAP[e.key]; } if(e.key === "Enter" && over) start(); if((e.key === "p" || e.key === "P") && !over) paused = !paused; });
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { if(over) start(); bee.want = b.dataset.d; });
  cv.addEventListener("click", () => { cv.focus(); if(over) start(); });
  load(); place(); hud(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
